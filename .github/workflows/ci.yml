name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Race tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: make test
      - run: go vet ./...

  build:
    name: Cross-platform build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: make build-all
