<rect x="831.000000" y="0.000000" width="206.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="934.000000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Voting Rights Timeline</text></g><g class="YW5zd2Vycw=="><g class="shape" ><rect x="75.000000" y="166.000000" width="890.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="520.000000" y="204.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">The following bullets identify the Amendments and dates that correspond with each answer choice from Q48 in the text:</text></g><g class="YW1lbmRtZW50LTI2"><g class="shape" ><rect x="0.000000" y="332.000000" width="215.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="107.500000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">26th Amendment (1971)</text></g><g class="YW1lbmRtZW50LTI0"><g class="shape" ><rect x="275.000000" y="332.000000" width="215.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="382.500000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">24th Amendment (1964)</text></g><g class="YW1lbmRtZW50LTE5"><g class="shape" ><rect x="550.000000" y="332.000000" width="214.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="657.000000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">19th Amendment (1920)</text></g><g class="YW1lbmRtZW50LTE1"><g class="shape" ><rect x="824.000000" y="332.000000" width="214.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="931.000000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">15th Amendment (1870)</text></g><g class="b3RoZXI="><g class="shape" ><rect x="1205.000000" y="166.000000" width="562.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1486.000000" y="204.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Other potential dates that address the expansion of voting rights include:</text></g><g class="dm90aW5nLXJpZ2h0cy1hY3Q="><g class="shape" ><rect x="1098.000000" y="332.000000" width="221.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1208.500000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Voting Rights Act of 1965</text></g><g class="Y2l2aWxzLXJpZ2h0cy1hY3Q="><g class="shape" ><rect x="1379.000000" y="332.000000" width="213.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1485.500000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Civils Rights Act of 1964</text></g><g class="aW5kaWFuLWNpdGl6ZW5zaGlwLWFjdA=="><g class="shape" ><rect x="1652.000000" y="332.000000" width="253.000000" height="66.000000" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1778.500000" y="370.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Indian Citizenship Act of 1924</text></g><g class="KHRpbWVsaW5lIC0mZ3Q7IGFuc3dlcnMpWzBd"><marker id="mk-d2-2351503000-3488378134" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnU